[package]
name = "excel-formula-inspector"
version = "1.0.0"
description = "Excel Formula Inspector — 離線 Excel 公式靜態檢查工具"
authors = ["Excel Formula Inspector contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "excel_formula_inspector_lib"
crate-type = ["rlib"]

[[bin]]
name = "excel-formula-inspector"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.36"
thiserror = "2"

[dev-dependencies]
rust_xlsxwriter = "0.100"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
